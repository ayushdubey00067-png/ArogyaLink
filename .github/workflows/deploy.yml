name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adp/ArogyaLink-is-a-low-cost-telemedicine-platform-des---/package-lock.json

      - name: Install dependencies
        working-directory: adp/ArogyaLink-is-a-low-cost-telemedicine-platform-des---
        run: npm ci

      - name: Build production bundle
        working-directory: adp/ArogyaLink-is-a-low-cost-telemedicine-platform-des---
        run: npm run build

      - name: Verify Pages artifact
        working-directory: adp/ArogyaLink-is-a-low-cost-telemedicine-platform-des---
        run: test -f dist/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: adp/ArogyaLink-is-a-low-cost-telemedicine-platform-des---/dist